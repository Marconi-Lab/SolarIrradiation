name: Tox CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tox:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]  # Specify the Python versions to test against, as per your tox envlist

    steps:
      # Step 1: Check out the repository
      - name: Check out the repository
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      # Step 4: Run Tox
      - name: Run Tox
        run: tox

  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies for formatting and linting
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run Tox Check Format
        run: tox -e check-format

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies for static analysis
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Run Tox Static Analysis
        run: tox -e static-analysis
