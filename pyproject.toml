[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SuSSE"
description = "Sub-Saharan Solar Estimation — satellite GHI bias correction over Sub-Saharan Africa"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jan Mikelson", email = "jan.mikelson@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dynamic = ["version", "dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = { find = { where = ["src"] } }

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
write_to = "src/susse/version.py"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10 -ra"
filterwarnings = [
    "ignore:'cgi' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/susse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
