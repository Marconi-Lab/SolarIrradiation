[tox]
envlist = py312, check-format, static-analysis
isolated_build = true
skipsdist = false

[testenv]
description = Run unit tests with coverage.
passenv =
    NASA_USERNAME
    NASA_PASSWORD
    EARTHDATA_USERNAME
    EARTHDATA_PASSWORD
    CAMS_EMAIL
setenv =
    PYTHONPATH = .
deps =
    -rrequirements.txt
    pytest-cov==5.0.0
    pytest-benchmark==4.0.0
    -e .
commands =
    pytest --junitxml=test-results/pytest-results-3.12.xml \
           --cov=src/susse \
           --cov-report=term-missing \
           --cov-report=html:test-results/coverage \
           tests {posargs}

[testenv:check-format]
description = Lint + import-order + formatting + docstring-coverage checks (no edits).
skip_install = true
deps =
    black==24.8.0
    isort==5.13.2
    flake8==6.1.0
    flake8-black==0.3.6
    interrogate==1.7.0
commands =
    black --check --target-version py312 src/susse tests
    isort --check --profile black src/susse tests
    flake8 src/susse
    interrogate -v --exclude '**__init__.py' --fail-under 60 src/susse

[testenv:format]
description = Auto-format the source tree (black + isort).
skip_install = true
deps =
    black==24.8.0
    isort==5.13.2
commands =
    black --target-version py312 src/susse tests
    isort --profile black src/susse tests

[testenv:static-analysis]
description = Static type checking with mypy.
deps =
    mypy==1.13
    -rrequirements.txt
    -e .
commands =
    python -m mypy src/susse

[flake8]
exclude = .tox, *.egg, .venv, build, dist
select = E, W, F
ignore = W503, F401, F403, F405, E501
max-line-length = 88
extend-ignore = E203
docstring-convention = google
